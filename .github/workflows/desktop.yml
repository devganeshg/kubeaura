name: Desktop builds

# Native desktop apps need each OS's toolchain (WKWebView / WebView2 /
# WebKitGTK), so they build on native runners. Run manually from the Actions
# tab, or tag a release — artifacts appear on the workflow run.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build KubeAura.app
        run: make app
      - name: Zip the bundle
        run: cd dist && zip -r KubeAura-macos.zip KubeAura.app
      - uses: actions/upload-artifact@v4
        with:
          name: KubeAura-macos
          path: dist/KubeAura-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build kubeaura.exe (desktop)
        shell: bash
        run: |
          CGO_ENABLED=1 go build -tags desktop -trimpath \
            -ldflags "-X main.version=${GITHUB_REF_NAME} -H windowsgui" \
            -o dist/kubeaura.exe ./cmd/kubeaura
      - name: Add double-click launcher
        shell: bash
        run: |
          printf 'start "" "%%~dp0kubeaura.exe" --desktop\r\n' > "dist/KubeAura Desktop.bat"
      - uses: actions/upload-artifact@v4
        with:
          name: KubeAura-windows
          path: dist/

  linux:
    # webview_go hard-codes `pkg-config webkit2gtk-4.0` in its cgo directives,
    # and ubuntu-24.04 (what ubuntu-latest now means) only ships 4.1. Building
    # on 22.04 gets the 4.0 package, and links against an older glibc, which is
    # what you want for a binary strangers download.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install WebKitGTK
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev
          if ! sudo apt-get install -y libwebkit2gtk-4.0-dev; then
            # Newer images only carry 4.1. The two are API-compatible for what
            # webview uses, so satisfy the 4.0 pkg-config lookup with a shim
            # rather than patching a vendored cgo directive.
            sudo apt-get install -y libwebkit2gtk-4.1-dev
            sudo tee /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc >/dev/null <<'EOF'
          Name: webkit2gtk-4.0
          Description: Shim forwarding to webkit2gtk-4.1
          Version: 4.0
          Requires: webkit2gtk-4.1
          EOF
          fi
          pkg-config --exists webkit2gtk-4.0
      - name: Build kubeaura (desktop)
        run: |
          CGO_ENABLED=1 go build -tags desktop -trimpath \
            -ldflags "-X main.version=${GITHUB_REF_NAME}" \
            -o dist/kubeaura ./cmd/kubeaura
      - name: Add .desktop launcher
        run: |
          mkdir -p dist
          cat > dist/kubeaura.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=KubeAura
          Comment=AI-assisted Kubernetes cockpit
          Exec=kubeaura --desktop
          Terminal=false
          Categories=Development;
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: KubeAura-linux
          path: dist/
