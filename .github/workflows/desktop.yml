name: Desktop builds

# Native desktop apps need each OS's toolchain (WKWebView / WebView2 /
# WebKitGTK), so they build on native runners. Run manually from the Actions
# tab, or tag a release — artifacts appear on the workflow run.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build KubeMind.app
        run: make app
      - name: Zip the bundle
        run: cd dist && zip -r KubeMind-macos.zip KubeMind.app
      - uses: actions/upload-artifact@v4
        with:
          name: KubeMind-macos
          path: dist/KubeMind-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build kubemind.exe (desktop)
        shell: bash
        run: |
          CGO_ENABLED=1 go build -tags desktop -trimpath \
            -ldflags "-X main.version=${GITHUB_REF_NAME} -H windowsgui" \
            -o dist/kubemind.exe ./cmd/kubemind
      - name: Add double-click launcher
        shell: bash
        run: |
          printf 'start "" "%%~dp0kubemind.exe" --desktop\r\n' > "dist/KubeMind Desktop.bat"
      - uses: actions/upload-artifact@v4
        with:
          name: KubeMind-windows
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build kubemind (desktop)
        run: |
          CGO_ENABLED=1 go build -tags desktop -trimpath \
            -ldflags "-X main.version=${GITHUB_REF_NAME}" \
            -o dist/kubemind ./cmd/kubemind
      - name: Add .desktop launcher
        run: |
          mkdir -p dist
          cat > dist/kubemind.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=KubeMind
          Comment=AI-assisted Kubernetes cockpit
          Exec=kubemind --desktop
          Terminal=false
          Categories=Development;
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: KubeMind-linux
          path: dist/
