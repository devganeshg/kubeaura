name: Release

# Tag a version (e.g. v0.1.0) to build cross-platform binaries and publish them
# to GitHub Releases so users can download and run KubeAura without Go, and to
# push the container image the in-cluster manifests reference.
on:
  push:
    tags:
      - "v*"
  # Lets the container image be (re)published for a tag whose release already
  # exists — a flaky registry should not cost you a version number.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the image for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: Binaries & GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set these repository secrets to publish the Homebrew tap and Scoop
          # bucket. Without them the `brews:`/`scoops:` blocks in
          # .goreleaser.yaml fail the release — delete those blocks if you are
          # not maintaining a tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Not docker/setup-qemu-action: it pulls the binfmt image from Docker Hub
      # with no retry, and a single rate-limited or slow response there failed
      # v0.1.0's image after the binaries had already published.
      - name: Set up QEMU for cross-arch builds
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if docker run --privileged --rm tonistiigi/binfmt:latest --install all; then
              exit 0
            fi
            echo "binfmt install failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done
          echo "could not install binfmt after 5 attempts"
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional and skipped when the secrets are absent, so a
      # release can never fail because a registry account was not set up. Add
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to enable it — see
      # docs/RELEASING.md.
      - id: hub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets not set — publishing to ghcr.io only."
          fi

      - if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/kubeaura
            ${{ steps.hub.outputs.enabled == 'true' && format('docker.io/{0}/kubeaura', secrets.DOCKERHUB_USERNAME) || '' }}
          # `value:` keeps the tags correct on a manual re-run, where the ref is
          # a branch and semver patterns would otherwise find nothing to match.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      # deploy/kubernetes/install.yaml and the Helm chart both point at this
      # image, so a release that skips it leaves the in-cluster path broken.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ inputs.tag || github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub shows a repo's README on its listing page; without this the
      # image looks abandoned next to every other result.
      - if: steps.hub.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/kubeaura
          short-description: "An AI-assisted Kubernetes cockpit you run yourself"
          readme-filepath: ./README.md
