apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeaura.fullname" . }}
  labels:
    {{- include "kubeaura.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubeaura.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeaura.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubeaura.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kubeaura
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 7654
          env:
            - name: KUBEAURA_ADDR
              value: ":7654"
            # A shared instance answers on the Pod IP and on the Ingress host,
            # so the loopback-only host check is relaxed. That is precisely why
            # the Ingress in front of it must authenticate users.
            - name: KUBEAURA_ALLOW_REMOTE
              value: "1"
            - name: ANTHROPIC_MODEL
              value: {{ .Values.ai.model | quote }}
            {{- if or .Values.ai.apiKey .Values.ai.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeaura.secretName" . }}
                  key: ANTHROPIC_API_KEY
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
