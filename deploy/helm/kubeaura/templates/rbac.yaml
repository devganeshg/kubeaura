apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeaura.serviceAccountName" . }}
  labels:
    {{- include "kubeaura.labels" . | nindent 4 }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeaura.fullname" . }}
  labels:
    {{- include "kubeaura.labels" . | nindent 4 }}
rules:
  # Read + inspect everything KubeAura lists in the UI.
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, namespaces, nodes, events, persistentvolumeclaims, persistentvolumes, serviceaccounts]
    verbs: [get, list, watch]
  {{- if .Values.rbac.allowSecrets }}
  # Opt-in: powers the Secrets browser, and exposes every Secret in the cluster
  # to anyone who can reach the UI.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  {{- end }}
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  {{- if not .Values.rbac.readOnly }}
  # Mutations for scale / restart / delete / apply. Drop this block (or set
  # rbac.readOnly=true) to run KubeAura in strictly read-only mode.
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, deployments/scale]
    verbs: [create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [create, update, patch, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeaura.fullname" . }}
  labels:
    {{- include "kubeaura.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeaura.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeaura.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
